plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akira.cuentagas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.akira.cuentadia'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
