plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akira.cuentagas'
    compileSdk 34

    signingConfigs {
        fija {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.akira.cuentadia'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
