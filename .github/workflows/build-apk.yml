name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Firma fija
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Usando firma fija"
          else
            echo "::warning::Falta el secreto DEBUG_KEYSTORE: la APK no se podrá instalar encima de la anterior"
          fi

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CuentaGas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CuentaGas-apk
          path: CuentaGas.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cuenta del día v1.${{ github.run_number }}
          files: CuentaGas.apk
