name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Firma fija
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta el secreto DEBUG_KEYSTORE"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/firma.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/firma.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/firma.keystore" -storepass android | grep SHA256:

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CuentaGas.apk

      - name: Comprobar firma
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs CuentaGas.apk | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: CuentaGas-apk
          path: CuentaGas.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cuenta del día v1.${{ github.run_number }}
          files: CuentaGas.apk
